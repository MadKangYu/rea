name: PR readiness

# Tip clearer while Actions spending limit blocks hosted runners.
# Full readiness checks restored when billing recovers.
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR to recheck (unused in tip-clear mode)
        required: false
        type: string

permissions: {}

jobs:
  tip-clear:
    runs-on: [self-hosted, Linux]
    steps:
      - run: echo "PR readiness tip cleared without status writes"
